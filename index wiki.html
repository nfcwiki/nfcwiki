<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cyber Tertis - Big Screen Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            margin: 0;
            padding: 10px;
            background: radial-gradient(circle at center, #2b0054 0%, #010004 100%);
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            background-size: cover;
            background-position: center;
        }

        .game-layout {
            display: flex;
            gap: 20px;
            align-items: center;
            background: rgba(15, 0, 35, 0.9);
            backdrop-filter: blur(12px);
            border: 3px solid #00ffff;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.7), inset 0 0 30px rgba(255, 0, 255, 0.5);
            border-radius: 15px;
            padding: 20px;
        }

        .main-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .game-header-title {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #ff00ff;
            margin-bottom: 8px;
            letter-spacing: 4px;
            text-align: center;
        }

        .board-wrapper {
            position: relative;
        }

        .shake {
            animation: megaShake 0.25s cubic-bezier(.36,.07,.19,.97) both;
        }

        @keyframes megaShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-12px, 10px); }
            40% { transform: translate(12px, -10px); }
            60% { transform: translate(-8px, -6px); }
            80% { transform: translate(8px, 6px); }
            100% { transform: translate(0, 0); }
        }

        .flash-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0);
            pointer-events: none;
            border-radius: 8px;
            z-index: 4;
            transition: background 0.03s ease-out;
        }
        .flash-overlay.active { background: rgba(255, 255, 255, 0.85); }

        /* 🖥️ 게임판 크기 확대 (기존보다 더 시원한 크기) */
        canvas {
            display: block;
            background: rgba(2, 0, 10, 0.95);
            border: 3px solid #00ffff;
            box-shadow: 0 0 35px rgba(0, 255, 255, 0.8);
            border-radius: 8px;
            width: 270px;
            height: 540px;
        }

        #combo-popup {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -50%) scale(0.2);
            font-size: 32px;
            font-weight: 900;
            color: #ffff00;
            text-shadow: 0 0 15px #ffffff, 0 0 30px #ff00ff, 0 0 50px #00ffff;
            pointer-events: none;
            opacity: 0;
            transition: all 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.6);
            z-index: 6;
            white-space: nowrap;
        }
        #combo-popup.show { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 160px;
        }

        .panel-box {
            background: rgba(10, 0, 25, 0.8);
            border: 2px solid #ff00ff;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            box-shadow: inset 0 0 15px rgba(255, 0, 255, 0.3);
        }

        .panel-box h3 {
            margin: 0 0 6px 0;
            font-size: 12px;
            color: #00ffff;
            letter-spacing: 1px;
        }

        .panel-box .value {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 10px #ff00ff;
        }

        .touch-controls {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 6px;
        }

        .control-btn {
            background: rgba(0, 255, 255, 0.15);
            border: 2px solid #00ffff;
            color: #00ffff;
            padding: 11px 0;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .control-btn:active { background: #00ffff; color: #010004; }
        .control-btn.action-drop { border-color: #ff00ff; color: #ff00ff; grid-column: span 2; }
        .control-btn.action-drop:active { background: #ff00ff; color: #010004; }

        .action-btns-group {
            display: flex;
            gap: 6px;
            margin-top: 6px;
            width: 100%;
        }

        .action-sub-btn {
            flex: 1;
            background: rgba(255, 0, 85, 0.25);
            border: 2px solid #ff0055;
            color: #ff0055;
            padding: 9px;
            font-family: 'Orbitron', sans-serif;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
        }
        .action-sub-btn:active { background: #ff0055; color: #fff; }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 0, 4, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-radius: 8px;
            padding: 20px;
        }

        .overlay h1 {
            font-size: 26px;
            color: #ffffff;
            text-shadow: 0 0 15px #00ffff, 0 0 30px #ff00ff;
            margin-bottom: 12px;
            text-align: center;
        }

        .menu-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 210px;
        }

        .btn {
            background: linear-gradient(45deg, #00ffff, #ff00ff);
            border: none;
            color: #ffffff;
            padding: 12px 18px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 900;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.6);
            text-align: center;
        }
        .btn:active { transform: scale(0.95); }

        .btn-sub {
            background: rgba(255, 0, 255, 0.25);
            border: 2px solid #ff00ff;
            color: #ff00ff;
            font-size: 11px;
            padding: 9px 12px;
            text-shadow: 0 0 6px #ff00ff;
        }

        .auth-panel {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 10px;
            text-align: center;
            width: 100%;
            max-width: 210px;
            font-size: 10px;
            color: #00ffff;
        }
        .auth-btns { display: flex; gap: 6px; margin-top: 5px; justify-content: center; }

        .settings-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            width: 100%;
            max-width: 220px;
            font-size: 10px;
            color: #e0d0ff;
            margin-bottom: 10px;
            max-height: 220px;
            overflow-y: auto;
        }
        .settings-form label { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
        .settings-form input, .settings-form select {
            width: 105px; background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff; color: #fff; padding: 4px; text-align: center;
            font-family: 'Orbitron', sans-serif; font-size: 10px; border-radius: 4px;
        }
        .settings-section-title { color: #00ffff; font-weight: 900; margin-top: 6px; border-bottom: 2px solid rgba(0,255,255,0.4); padding-bottom: 2px; }

        /* 📱 모바일 반응형 처리 */
        @media (max-width: 768px) {
            body { padding: 4px; align-items: flex-start; overflow-y: auto; }
            .game-layout {
                flex-direction: column;
                align-items: center;
                padding: 10px;
                gap: 8px;
                width: 100%;
            }
            .side-panel {
                width: 240px;
                flex-direction: row;
                justify-content: space-between;
                gap: 6px;
            }
            .panel-box { flex: 1; padding: 6px; }
            canvas { width: 220px; height: 440px; }
            .touch-controls { width: 240px; }
            .action-btns-group { width: 240px; }
        }
    </style>
</head>
<body>

    <div class="game-layout">
        <div class="side-panel">
            <div class="panel-box">
                <h3>NEXT</h3>
                <canvas id="next-canvas" width="55" height="55" style="width:55px; height:55px; margin:0 auto; display:block; background:transparent; border:none; box-shadow:none;"></canvas>
            </div>
            <div class="panel-box">
                <h3 id="stat-title">SCORE</h3>
                <div id="score" class="value">0</div>
            </div>
            <div class="panel-box">
                <h3 id="sub-stat-title">LEVEL</h3>
                <div id="level" class="value">1</div>
            </div>
        </div>

        <div class="main-section">
            <div class="game-header-title">⚡ CYBER TERTIS ⚡</div>
            <div class="board-wrapper" id="board-wrapper">
                <div class="flash-overlay" id="flash-overlay"></div>
                <div id="combo-popup"></div>
                <canvas id="tetris" width="300" height="600"></canvas>
                
                <div id="start-screen" class="overlay">
                    <h1>CYBER<br>TERTIS</h1>
                    <div class="auth-panel" id="auth-panel">
                        <div id="user-info">연동 상태 확인중...</div>
                        <div class="auth-btns" id="auth-btns">
                            <button class="btn btn-sub" onclick="loginGuest()" style="padding:5px 10px; font-size:10px;">게스트</button>
                            <button class="btn btn-sub" onclick="loginGoogle()" style="padding:5px 10px; font-size:10px;">구글연동</button>
                        </div>
                    </div>
                    <div class="menu-group">
                        <button class="btn" onclick="startGame('classic')">CLASSIC</button>
                        <button class="btn" onclick="startGame('timeAttack')">TIME ATTACK</button>
                        <button class="btn" onclick="startGame('blockLimit')">BLOCK LIMIT</button>
                        <button class="btn btn-sub" onclick="openSettings()">CUSTOM SETTINGS</button>
                    </div>
                </div>

                <div id="pause-screen" class="overlay" style="display: none;">
                    <h1>PAUSED</h1>
                    <div class="menu-group">
                        <button class="btn" onclick="resumeGame()">RETURN</button>
                        <button class="btn" onclick="restartGame()">RESTART</button>
                        <button class="btn btn-sub" onclick="returnToMenu()">MAIN MENU</button>
                    </div>
                </div>

                <div id="settings-screen" class="overlay" style="display: none;">
                    <h1>SETTINGS</h1>
                    <div class="settings-form">
                        <div class="settings-section-title">🎨 THEME PRESET</div>
                        <label>배경 테마: 
                            <select id="cfg-bg">
                                <option value="cyber">1. 사이버 네온</option>
                                <option value="dark">2. 다크 심플</option>
                                <option value="matrix">3. 매트릭스 그린</option>
                                <option value="synthwave">4. 썬웨이브 핑크</option>
                                <option value="galaxy">5. 딥 갤럭시</option>
                            </select>
                        </label>
                        <label>블록 팔레트: 
                            <select id="cfg-block">
                                <option value="neon">1. 네온 사이버</option>
                                <option value="pastel">2. 파스텔 톤</option>
                                <option value="mono">3. 모노크롬</option>
                                <option value="retro">4. 레트로 아케이드</option>
                                <option value="candy">5. 스위트 캔디</option>
                            </select>
                        </label>
                    </div>
                    <button class="btn" onclick="closeSettings()">SAVE & BACK</button>
                </div>
                
                <div id="gameover-screen" class="overlay" style="display: none;">
                    <h1>GAME OVER</h1>
                    <p id="final-score" style="margin-bottom: 6px; font-size: 14px; color: #00ffff; font-weight: bold;">SCORE: 0</p>
                    <p id="cloud-status" style="margin-bottom: 12px; font-size: 10px; color: #ff00ff;"></p>
                    <div class="menu-group">
                        <button class="btn" onclick="restartGame()">RESTART</button>
                        <button class="btn btn-sub" onclick="returnToMenu()">MAIN MENU</button>
                    </div>
                </div>
            </div>

            <div style="width: 100%; max-width: 240px; margin-top: 8px;">
                <div class="action-btns-group">
                    <button class="action-sub-btn" onclick="quitGame()">PAUSE / QUIT</button>
                    <button class="action-sub-btn" onclick="restartGame()" style="border-color: #00ffff; color: #00ffff;">RESTART</button>
                </div>
                <div class="touch-controls">
                    <button class="control-btn" onclick="playerMove(-1)">◀</button>
                    <button class="control-btn" onclick="playerRotate(1)">🔄</button>
                    <button class="control-btn" onclick="playerDrop()">▼</button>
                    <button class="control-btn" onclick="playerMove(1)">▶</button>
                    <button class="control-btn action-drop" onclick="playerHardDrop()">🚀 DROP</button>
                </div>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // 💡 [중요] 본인의 파이어베이스 설정값 입력
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
        projectId: "YOUR_PROJECT_ID",
        storageBucket: "YOUR_PROJECT_ID.appspot.com",
        messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
        appId: "YOUR_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    onAuthStateChanged(auth, async (user) => {
        currentUser = user;
        const userInfoDiv = document.getElementById('user-info');
        const authBtns = document.getElementById('auth-btns');

        if (user) {
            let name = user.isAnonymous ? "게스트" : (user.displayName || "구글 유저");
            userInfoDiv.innerText = `${name}님 접속중`;
            authBtns.style.display = 'none';
            await loadSettingsFromCloud(user.uid);
        } else {
            userInfoDiv.innerText = "로그인 필요";
            authBtns.style.display = 'flex';
        }
    });

    window.loginGuest = function() { signInAnonymously(auth).catch(e => {}); }
    window.loginGoogle = function() { signInWithPopup(auth, new GoogleAuthProvider()).catch(e => {}); }

    window.saveToCloud = async function(score) {
        if (!currentUser) return;
        const statusEl = document.getElementById('cloud-status');
        try {
            const userRef = doc(db, "users", currentUser.uid);
            const docSnap = await getDoc(userRef);
            let previousBest = docSnap.exists() ? (docSnap.data().highScore || 0) : 0;
            let newHighScore = Math.max(score, previousBest);

            await setDoc(userRef, {
                highScore: newHighScore,
                name: currentUser.isAnonymous ? "Guest" : currentUser.displayName,
                settings: window.ruleConfig,
                updatedAt: new Date()
            }, { merge: true });

            statusEl.innerText = score > previousBest ? `✨ 최고 기록 경신! (${score}점)` : `기존 최고 기록: ${previousBest}점`;
        } catch (e) {
            statusEl.innerText = "클라우드 저장 실패";
        }
    }

    async function loadSettingsFromCloud(uid) {
        try {
            const userRef = doc(db, "users", uid);
            const docSnap = await getDoc(userRef);
            if (docSnap.exists() && docSnap.data().settings) {
                window.ruleConfig = docSnap.data().settings;
                window.applySavedSettingsToUI();
            }
        } catch (e) {}
    }
</script>

<script>
    const canvas = document.getElementById('tetris');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-canvas');
    const nextCtx = nextCanvas.getContext('2d');

    const BLOCK_SIZE = 30;
    const COLS = 10;
    const ROWS = 20;

    ctx.scale(BLOCK_SIZE, BLOCK_SIZE);
    nextCtx.scale(BLOCK_SIZE, BLOCK_SIZE);

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBeepSound(type) {
        try {
            initAudio();
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'drop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.08);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now); osc.stop(now + 0.08);
            } else if (type === 'clear') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(554.37, now + 0.06);
                osc.frequency.setValueAtTime(659.25, now + 0.12);
                osc.frequency.setValueAtTime(880, now + 0.18);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.start(now); osc.stop(now + 0.3);
            }
        } catch (e) {}
    }

    const COLOR_PALETTES = {
        neon: [null, '#00ffff', '#ff00ff', '#ff9900', '#ffff00', '#00ff66', '#b000ff', '#ff0055'],
        pastel: [null, '#70a1ff', '#ff7f50', '#ff6b81', '#ffeaa7', '#2ed573', '#9b59b6', '#ff4757'],
        mono: [null, '#ffffff', '#e0e0e0', '#bcbcbc', '#9a9a9a', '#787878', '#565656', '#343434'],
        retro: [null, '#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff', '#ffffff'],
        candy: [null, '#ff9a9e', '#fecfef', '#a1c4fd', '#c2e9fb', '#ffecd2', '#fcb69f', '#ff8177']
    };

    let activeColors = COLOR_PALETTES.neon;
    let ruleConfig = { bgStyle: 'cyber', blockStyle: 'neon', timeLimit: 120, maxBlocks: 40, l1: 30, l2: 100, l3: 250, l4: 500, combo: 30 };
    window.ruleConfig = ruleConfig;

    function applyTheme() {
        const body = document.body;
        const themes = {
            cyber: 'radial-gradient(circle at center, #2b0054 0%, #010004 100%)',
            dark: '#0a0a0a',
            matrix: 'radial-gradient(circle at center, #005f33 0%, #001103 100%)',
            synthwave: 'radial-gradient(circle at center, #4a0e4e 0%, #0a0118 100%)',
            galaxy: 'radial-gradient(circle at center, #1b003a 0%, #030008 100%)'
        };
        body.style.background = themes[ruleConfig.bgStyle] || themes.cyber;
        activeColors = COLOR_PALETTES[ruleConfig.blockStyle] || COLOR_PALETTES.neon;
    }

    window.applySavedSettingsToUI = function() {
        document.getElementById('cfg-bg').value = ruleConfig.bgStyle;
        document.getElementById('cfg-block').value = ruleConfig.blockStyle;
        applyTheme();
    }

    let particles = [];
    function triggerMegaImpact(dropX, dropY) {
        playBeepSound('drop');
        const wrapper = document.getElementById('board-wrapper');
        wrapper.classList.remove('shake');
        void wrapper.offsetWidth;
        wrapper.classList.add('shake');

        const flash = document.getElementById('flash-overlay');
        flash.classList.add('active');
        setTimeout(() => flash.classList.remove('active'), 100);

        for (let i = 0; i < 70; i++) {
            particles.push({
                x: dropX !== undefined ? dropX : Math.random() * COLS,
                y: dropY !== undefined ? dropY : ROWS - 2,
                vx: (Math.random() - 0.5) * 1.8,
                vy: (Math.random() - 0.7) * 1.8,
                color: ['#00ffff', '#ff00ff', '#ffff00', '#ffffff'][Math.floor(Math.random() * 4)],
                life: 1.2,
                size: Math.random() * 0.5 + 0.2
            });
        }
    }

    function createHyperClearSparks(rowY) {
        playBeepSound('clear');
        for (let i = 0; i < 140; i++) {
            particles.push({
                x: Math.random() * COLS,
                y: rowY,
                vx: (Math.random() - 0.5) * 2.5,
                vy: (Math.random() - 0.5) * 2.5 - 0.6,
                color: ['#00ffff', '#ff00ff', '#ffff00', '#ffffff'][Math.floor(Math.random() * 4)],
                life: 1.5,
                size: Math.random() * 0.7 + 0.3
            });
        }
    }

    function updateParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life -= 0.02;
            if (p.life <= 0) particles.splice(i, 1);
        }
    }

    function drawParticles() {
        particles.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 25;
            ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        ctx.shadowBlur = 0;
    }

    let comboTimeout = null;
    function showComboPopup(text) {
        const popup = document.getElementById('combo-popup');
        popup.innerText = text;
        popup.classList.add('show');
        if (comboTimeout) clearTimeout(comboTimeout);
        comboTimeout = setTimeout(() => popup.classList.remove('show'), 800);
    }

    const SHAPES = [
        [],
        [[0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0], [0, 1, 0, 0]],
        [[2, 0, 0], [2, 2, 2], [0, 0, 0]],
        [[0, 0, 3], [3, 3, 3], [0, 0, 0]],
        [[4, 4], [4, 4]],
        [[0, 5, 5], [5, 5, 0], [0, 0, 0]],
        [[0, 6, 0], [6, 6, 6], [0, 0, 0]],
        [[7, 7, 0], [0, 7, 7], [0, 0, 0]]
    ];

    let arena = createMatrix(COLS, ROWS);
    let score = 0, level = 1, combo = 0, dropInterval = 1000, dropCounter = 0, lastTime = 0;
    let gameOverFlag = true, isPaused = false, currentMode = 'classic', timeLeft = 120, blocksLeft = 40, modeTimer = null;

    function createMatrix(w, h) {
        const matrix = [];
        while (h--) matrix.push(new Array(w).fill(0));
        return matrix;
    }

    function createPiece(type) { return SHAPES[type]; }

    function drawMatrix(matrix, offset, context = ctx, isNext = false) {
        matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) {
                    context.fillStyle = activeColors[value];
                    context.shadowColor = activeColors[value];
                    context.shadowBlur = isNext ? 10 : 25;
                    context.fillRect(x + offset.x, y + offset.y, 1, 1);
                    context.strokeStyle = '#ffffff';
                    context.lineWidth = 0.12;
                    context.strokeRect(x + offset.x, y + offset.y, 1, 1);
                }
            });
        });
        context.shadowBlur = 0;
    }

    function draw() {
        ctx.fillStyle = 'rgba(2, 0, 10, 0.4)';
        ctx.fillRect(0, 0, COLS, ROWS);
        drawMatrix(arena, {x: 0, y: 0});
        if (!gameOverFlag && !isPaused && player.matrix) {
            drawMatrix(player.matrix, player.pos);
        }
        updateParticles();
        drawParticles();
    }

    const player = { pos: {x: 0, y: 0}, matrix: null };
    const nextPlayer = { matrix: null };

    function drawNext() {
        nextCtx.fillStyle = 'rgba(0, 0, 0, 0)';
        nextCtx.fillRect(0, 0, nextCanvas.width, nextCanvas.height);
        const matrix = nextPlayer.matrix;
        if (!matrix) return;
        drawMatrix(matrix, { x: (2 - matrix[0].length) / 2, y: (2 - matrix.length) / 2 }, nextCtx, true);
    }

    function merge(arena, player) {
        let avgX = player.pos.x + player.matrix[0].length / 2;
        let avgY = player.pos.y + player.matrix.length / 2;
        player.matrix.forEach((row, y) => {
            row.forEach((value, x) => {
                if (value !== 0) arena[y + player.pos.y][x + player.pos.x] = value;
            });
        });
        triggerMegaImpact(avgX, avgY);
    }

    function rotate(matrix, dir) {
        for (let y = 0; y < matrix.length; ++y) {
            for (let x = 0; x < y; ++x) {
                [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
            }
        }
        if (dir > 0) matrix.forEach(row => row.reverse());
        else matrix.reverse();
    }

    function playerRotate(dir) {
        if (gameOverFlag || isPaused) return;
        initAudio();
        const posX = player.pos.x;
        let offset = 1;
        rotate(player.matrix, dir);
        while (collide(arena, player)) {
            player.pos.x += offset;
            offset = -(offset + (offset > 0 ? 1 : -1));
            if (offset > player.matrix[0].length) {
                rotate(player.matrix, -dir);
                player.pos.x = posX;
                return;
            }
        }
    }

    function collide(arena, player) {
        const m = player.matrix;
        const o = player.pos;
        for (let y = 0; y < m.length; ++y) {
            for (let x = 0; x < m[y].length; ++x) {
                if (m[y][x] !== 0 && (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) return true;
            }
        }
        return false;
    }

    function playerDrop() {
        if (gameOverFlag || isPaused) return;
        player.pos.y++;
        if (collide(arena, player)) {
            player.pos.y--;
            merge(arena, player);
            playerReset();
            arenaSweep();
            updateStats();
        }
        dropCounter = 0;
    }

    function playerHardDrop() {
        if (gameOverFlag || isPaused) return;
        while (!collide(arena, player)) player.pos.y++;
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateStats();
        dropCounter = 0;
    }

    function playerMove(dir) {
        if (gameOverFlag || isPaused) return;
        initAudio();
        player.pos.x += dir;
        if (collide(arena, player)) player.pos.x -= dir;
    }

    function playerReset() {
        if (nextPlayer.matrix === null) nextPlayer.matrix = createPiece(Math.floor(Math.random() * 7) + 1);
        player.matrix = nextPlayer.matrix;
        nextPlayer.matrix = createPiece(Math.floor(Math.random() * 7) + 1);
        player.pos.y = 0;
        player.pos.x = Math.floor((COLS - player.matrix[0].length) / 2);

        if (currentMode === 'blockLimit') {
            blocksLeft--;
            if (blocksLeft < 0) { endGame(); return; }
        }
        if (collide(arena, player)) endGame();
        drawNext();
    }

    function arenaSweep() {
        let rowCount = 0;
        outer: for (let y = arena.length - 1; y > 0; --y) {
            for (let x = 0; x < arena[y].length; x++) {
                if (arena[y][x] === 0) continue outer;
            }
            arena.splice(y, 1);
            arena.unshift(new Array(COLS).fill(0));
            y++;
            rowCount++;
            createHyperClearSparks(y);
        }

        if (rowCount > 0) {
            combo++;
            let baseScore = rowCount === 1 ? ruleConfig.l1 : rowCount === 2 ? ruleConfig.l2 : rowCount === 3 ? ruleConfig.l3 : ruleConfig.l4;
            score += (baseScore + (combo > 1 ? combo * ruleConfig.combo : 0)) * level;

            if (rowCount >= 4) showComboPopup("HYPER TETRIS!! 🚀🔥");
            else if (combo >= 2) showComboPopup(`${combo} COMBO!! ✨⚡`);
        } else {
            combo = 0;
        }
        level = Math.floor(score / 600) + 1;
        dropInterval = Math.max(120, 1000 - (level - 1) * 110);
    }

    function updateStats() {
        document.getElementById('score').innerText = score;
        document.getElementById('level').innerText = currentMode === 'timeAttack' ? `${timeLeft}s` : currentMode === 'blockLimit' ? `${blocksLeft} 남음` : level;
    }

    function update(time = 0) {
        if (gameOverFlag) return;
        if (!isPaused) {
            dropCounter += time - lastTime;
            if (dropCounter > dropInterval) playerDrop();
        }
        lastTime = time;
        draw();
        requestAnimationFrame(update);
    }

    document.addEventListener('keydown', event => {
        initAudio();
        if (gameOverFlag || isPaused) return;
        if (event.key === 'ArrowLeft') playerMove(-1);
        else if (event.key === 'ArrowRight') playerMove(1);
        else if (event.key === 'ArrowDown') playerDrop();
        else if (event.key === 'ArrowUp') playerRotate(1);
        else if (event.key === ' ') { event.preventDefault(); playerHardDrop(); }
    });

    function startGame(mode) {
        initAudio();
        currentMode = mode;
        arena.forEach(row => row.fill(0));
        score = 0; level = 1; combo = 0; dropInterval = 1000; gameOverFlag = false; isPaused = false;

        if (currentMode === 'timeAttack') {
            timeLeft = ruleConfig.timeLimit;
            if (modeTimer) clearInterval(modeTimer);
            modeTimer = setInterval(() => {
                if (gameOverFlag || isPaused) return;
                timeLeft--;
                updateStats();
                if (timeLeft <= 0) endGame();
            }, 1000);
        }
        updateStats();
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('pause-screen').style.display = 'none';
        document.getElementById('settings-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        
        nextPlayer.matrix = createPiece(Math.floor(Math.random() * 7) + 1);
        playerReset();
        lastTime = performance.now();
        update();
    }

    function restartGame() {
        document.getElementById('pause-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        startGame(currentMode);
    }

    function resumeGame() { isPaused = false; document.getElementById('pause-screen').style.display = 'none'; lastTime = performance.now(); }

    function endGame() {
        gameOverFlag = true;
        if (modeTimer) clearInterval(modeTimer);
        document.getElementById('final-score').innerText = `SCORE: ${score}`;
        document.getElementById('gameover-screen').style.display = 'flex';
        if (window.saveToCloud) window.saveToCloud(score);
    }

    function returnToMenu() {
        gameOverFlag = true; isPaused = false;
        if (modeTimer) clearInterval(modeTimer);
        arena.forEach(row => row.fill(0));
        draw();
        document.getElementById('pause-screen').style.display = 'none';
        document.getElementById('gameover-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
    }

    function quitGame() {
        if (gameOverFlag) returnToMenu();
        else { isPaused = true; document.getElementById('pause-screen').style.display = 'flex'; }
    }

    function openSettings() { document.getElementById('start-screen').style.display = 'none'; document.getElementById('settings-screen').style.display = 'flex'; }
    function closeSettings() {
        ruleConfig.bgStyle = document.getElementById('cfg-bg').value;
        ruleConfig.blockStyle = document.getElementById('cfg-block').value;
        applyTheme();
        document.getElementById('settings-screen').style.display = 'none';
        document.getElementById('start-screen').style.display = 'flex';
        if (window.saveToCloud) window.saveToCloud(score);
    }
</script>
</body>
</html>
